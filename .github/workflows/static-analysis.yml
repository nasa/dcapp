name: Static Analysis

on:
  push:
    branches:
      - master
      - dcapp-pl
      - feature/*
      - fix/*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-diagnostics:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libxml2-dev libgdal-dev libcurl4-openssl-dev

      - name: Check C diagnostics
        run: |
          set -euo pipefail

          INCLUDES=(
            -I apps
            -I src
            -I extensions
            -I shaders
            -I pilotlight/src
            -I pilotlight/libs
            -I pilotlight/extensions
            -I pilotlight/shaders
            -I pilotlight/dependencies/stb
            -I pilotlight/dependencies/cgltf
            -I pilotlight/dependencies/imgui
            -I pilotlight/dependencies/glfw/include
            -I /usr/include/libxml2
            -I /usr/include/gdal
          )

          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE_REF" ] || [[ "$BASE_REF" =~ ^0+$ ]] || ! git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            BASE_REF="HEAD~1"
          fi

          mapfile -d '' FILES < <(
            git diff --name-only -z --diff-filter=ACMR "$BASE_REF"...HEAD |
              while IFS= read -r -d '' f; do
                case "$f" in
                  apps/*.c|extensions/*.c|src/*.c|src/*/*.c)
                    printf '%s\0' "$f"
                    ;;
                esac
              done |
              sort -zu
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed C sources to check."
            exit 0
          fi

          for f in "${FILES[@]}"; do
            echo "=== Checking $f ==="
            clang -fsyntax-only -std=gnu11 -Werror "$f" "${INCLUDES[@]}"
          done

  clang-format:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14

      - name: Check formatting
        run: |
          set -euo pipefail
          mapfile -d '' FILES < <(
            git ls-files -z -- '*.c' '*.h' '*.cc' '*.cpp' '*.cxx' '*.hh' '*.hpp' '*.hxx' '*.m' '*.mm' |
              while IFS= read -r -d '' f; do
                if [ "$f" != "tools/terrain/pl_icons.h" ]; then
                  printf '%s\0' "$f"
                fi
              done |
              sort -zu
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No C/C++ style files to check."
            exit 0
          fi

          clang-format-14 --version
          echo "Checking ${#FILES[@]} C/C++ source files."
          clang-format-14 --dry-run --Werror --style=file -- "${FILES[@]}"
